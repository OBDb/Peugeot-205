generations:
  - name: "First Generation"
    start_year: 1983
    end_year: 1990
    description: "The Peugeot 205 was a revolutionary small car that transformed Peugeot's image and financial fortunes. Designed by Gerard Welter (with Pininfarina styling the cabriolet), it featured clean, timeless styling that aged remarkably well throughout its production run. Available in three and five-door hatchback body styles, plus a unique two-door cabriolet created in collaboration with Pininfarina. The fully independent suspension used MacPherson struts at the front and trailing arms with torsion bars at the rear. Early models used the X petrol engine from the older Peugeot 104, later replaced with newer XU and TU-series engines. Engines ranged from 954cc to 1905cc, in carbureted or fuel-injected versions. The diesel models employed the PSA XUD engine, lifted from the Citroën BX, offering petrol-like performance with diesel economy. The interior was simple but well-designed, with good visibility and space utilization despite compact exterior dimensions. Dashboard redesign occurred for the 1988 model year. Notable variants included the GTI performance models launched in 1984, the Rallye stripped sports version, and numerous special editions. The 205 T16 Group B rally car shared little more than styling with the road car but cemented the model's sporting credentials with two World Rally Championships (1985-1986)."
  - name: "First Generation (Facelift)"
    start_year: 1990
    end_year: 1998
    description: "In late 1990, the 205 received a significant facelift introducing new door design with updated cards, clear front indicators replacing amber units, new 'smoked' rear light clusters, single-point petrol injection (Bosch Mono-Jetronic), and catalytic converters to meet 1992 emissions standards. The styling evolution was subtle but distinct, maintaining the car's timeless appeal while updating it for the new decade. The XU and TU engines continued with improvements, including the introduction of the turbocharged 1.8 diesel dTurbo in 1991 delivering enhanced performance in the diesel segment. The STDT (Special Trim Diesel Turbo) was introduced in 1993, offering GTI-like handling in a diesel package with bucket seats, power steering, and alloy wheels. The GTI continued through 1994, though the 1.6 was discontinued in 1992 due to emissions regulations while the 1.9 continued with catalytic converter. Special editions included the Miami Blue and Sorrento Green limited GTIs (1989-1990), the Gentry luxury variant with leather interior, and the 1FM UK-exclusive 25th anniversary edition. Production ended in the UK in 1996, with the final 'Sacré Numéro' and 'Génération' models sold until 1998 in Argentina and France. Over 5.2 million units were produced during its remarkable 15-year run."
